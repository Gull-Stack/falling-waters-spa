name: Release falling-waters domain from legacy Vercel
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect + release domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          H="Authorization: Bearer $VERCEL_TOKEN"
          api() { curl -s -H "$H" "$@"; }

          echo "=== Token identity ==="
          api https://api.vercel.com/v2/user | jq '{uid, email, username, defaultTeamId}'

          echo ""
          echo "=== Teams this token can reach ==="
          TEAMS_JSON=$(api https://api.vercel.com/v2/teams)
          echo "$TEAMS_JSON" | jq '.teams[] | {id, name, slug}'
          TEAM_IDS=$(echo "$TEAMS_JSON" | jq -r '.teams[].id // empty')

          echo ""
          echo "=== Personal (no team) projects matching 'falling' ==="
          api "https://api.vercel.com/v9/projects?search=falling" | jq '.projects[]? | {id, name}'

          echo ""
          echo "=== Domain lookup: personal scope ==="
          api "https://api.vercel.com/v5/domains/fallingwatersdayspa.com" | jq '.'

          for T in $TEAM_IDS; do
            echo ""
            echo "=== Team $T — projects matching 'falling' ==="
            api "https://api.vercel.com/v9/projects?teamId=$T&search=falling" | jq '.projects[]? | {id, name}'

            echo ""
            echo "=== Team $T — domain lookup for fallingwatersdayspa.com ==="
            api "https://api.vercel.com/v5/domains/fallingwatersdayspa.com?teamId=$T" | jq '.'
          done
