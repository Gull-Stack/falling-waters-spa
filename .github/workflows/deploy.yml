name: Promote main to Vercel Production
on:
  push:
    branches: [main]

# Deploys the site to Vercel production on every push to main.
# Auth uses three repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Passing the org + project as env vars (instead of --scope) lets the Vercel
# CLI link to the project directly — the documented CI pattern.
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (production)
        run: |
          npx vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          npx vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
          npx vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
